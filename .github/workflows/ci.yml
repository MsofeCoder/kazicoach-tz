name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:functions
      - run: npm run lint:eslint
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm audit --audit-level=high
