name: Validate v2 without deployment
on:
  push:
    branches: [feature/kazicoach-v2]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - name: Pull isolated authorization-test database
        run: docker pull postgres:17-alpine
        timeout-minutes: 5
      - run: npm run test:db
      - run: npm run lint
      - run: npm run lint:functions
      - run: npm run lint:eslint
      - run: npm run test:release-config
      - run: npm run build
      - run: npm run audit:release
      - run: npm run smoke
